name: RaceDay CI Validation

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Verify Docs Folder and Required Files
      run: |
        echo "Checking if /docs folder exists..."
        if [ -d "docs" ]; then
          echo "/docs folder found successfully."
        else
          echo "Error: /docs folder missing!"
          exit 1
        fi

        echo "Verifying contents of /docs folder..."
        ls -la docs/
        
        if [ -n "$(ls -A docs/)" ]; then
          echo "Docs folder contains required planning deliverables. Validation passed!"
        else
          echo "Error: /docs folder is empty!"
          exit 1
        fi